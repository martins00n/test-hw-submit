name: Homework CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-homework-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute notebooks (all homeworks)
        if: github.event_name != 'pull_request'
        run: python scripts/check_homeworks.py

      - name: Execute notebooks (changed homeworks only)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python scripts/check_homeworks.py --only-changed --base-ref "${BASE_SHA}"
